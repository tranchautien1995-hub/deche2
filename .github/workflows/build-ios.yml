name: Build AoE2 HD Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and verify construction, training and match controls
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          mkdir -p "$cache"
          curl -fLsS --retry 3 https://domotix.co/download/9 -o "$cache/source.zip"
          printf '%s  %s\n' 2fff02c922ef5c6221dde6cd5b93569b427b277c38eae9e8231a7d70869573ef "$cache/source.zip" | sha256sum -c
          unzip -q "$cache/source.zip" -d "$cache"
          mv "$cache/AoE2HDBeta-1.2.0-source/AoE2HDBeta-source" "$cache/AoE2HDBeta-source"
          model=vi_VN-vais1000-medium
          base=https://huggingface.co/rhasspy/piper-voices/resolve/320d5f7f7751a17ef6512d5c23863056c6a11c0f/vi/vi_VN/vais1000/medium
          curl -fLsS --retry 3 "$base/$model.onnx?download=true" -o "$cache/$model.onnx"
          curl -fLsS --retry 3 "$base/$model.onnx.json?download=true" -o "$cache/$model.onnx.json"
          printf '%s  %s\n' 5e42428c4f6131f75557cf156c9c1526 "$cache/$model.onnx" 5ec9669253541d64ba97f60e422f1ad0 "$cache/$model.onnx.json" | md5sum -c
          python3 -m venv "$cache/voice-env"
          "$cache/voice-env/bin/pip" install 'piper-tts==1.4.1'
          project="$cache/AoE2HDBeta-source/godot_game"
          "$cache/voice-env/bin/python" unit_voice.py "$project" "$cache/$model.onnx"
          python3 prepare_ios.py "$project"
          engine=Godot_v4.7.2-stable_linux.x86_64
          curl -fLsS --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$engine.zip" -o "$cache/godot.zip"
          unzip -q "$cache/godot.zip" -d "$cache"
          godot="$cache/$engine"
          "$godot" --headless --path "$project" --import >"$cache/godot-import.log" 2>&1 || {
            tail -100 "$cache/godot-import.log"
            exit 1
          }
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' "$cache/godot-import.log"; then
            exit 1
          fi
          "$godot" --headless --path "$project" --quit-after 8 >"$cache/godot-first-run.log" 2>&1
          if grep -E 'SCRIPT ERROR|Failed to load script' "$cache/godot-first-run.log"; then
            exit 1
          fi
          "$godot" --headless --path "$project" --quit-after 150 res://tests/lasso.tscn | tee "$cache/godot-input.log"
          grep -F 'MOBILE INPUT AND VOICE: 0 failures' "$cache/godot-input.log"
          python3 "$cache/AoE2HDBeta-source/tools/mp_mock_server.py" 18081 > "$cache/mock-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if grep -q 'mock lobby server on' "$cache/mock-server.log"; then break; fi
            sleep 0.2
          done
          grep -q 'mock lobby server on' "$cache/mock-server.log"
          AOE_MP_URL=http://127.0.0.1:18081/ XDG_DATA_HOME="$cache/test-user-data" \
            timeout 35s "$godot" --headless --path "$project" res://tests/room_code_test.tscn 2>&1 | tee "$cache/godot-lobby.log"
          grep -F 'LOBBY AND ROOM CODE: 0 failures' "$cache/godot-lobby.log"
          if grep -E 'SCRIPT ERROR|Failed to load script' "$cache/godot-lobby.log"; then exit 1; fi
          timeout 25s "$godot" --headless --path "$project" res://tests/construction_test.tscn 2>&1 | tee "$cache/godot-construction.log"
          grep -F "CONSTRUCTION AND TRAINING: 0 failures" "$cache/godot-construction.log"
          if grep -E "SCRIPT ERROR|Failed to load script" "$cache/godot-construction.log"; then exit 1; fi
          timeout 35s "$godot" --headless --path "$project" res://tests/battle_setup_test.tscn 2>&1 | tee "$cache/godot-battle.log"
          grep -F "BATTLE AND SPAWN: 0 failures" "$cache/godot-battle.log"
          if grep -E "SCRIPT ERROR|Failed to load script" "$cache/godot-battle.log"; then exit 1; fi
          tar -czf game-project.tar.gz --exclude='AoE2HDBeta-source/godot_game/.godot' -C "$cache" AoE2HDBeta-source
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-game-project
          path: game-project.tar.gz
          if-no-files-found: error
          retention-days: 1

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-game-project
          path: prepared
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export and verify the Android APK
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          sdk="${ANDROID_HOME:?Android SDK unavailable}"
          tools="$sdk/build-tools/35.0.1"
          if [[ ! -x "$tools/apksigner" ]]; then
            sdkmanager --sdk_root="$sdk" "build-tools;35.0.1"
          fi
          cfg="$cache/editor-settings/godot"
          templates="$cache/editor-data/godot/export_templates/4.7.2.stable"
          mkdir -p "$cache" "$cfg" "$templates" android-artifact
          export XDG_CONFIG_HOME="$cache/editor-settings"
          export XDG_DATA_HOME="$cache/editor-data"
          tar -xzf prepared/game-project.tar.gz -C "$cache"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          engine=Godot_v4.7.2-stable_linux.x86_64
          curl -fLsS --retry 3 "$base/$engine.zip" -o "$cache/godot.zip"
          unzip -q "$cache/godot.zip" -d "$cache"
          curl -fLsS --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$cache/templates.tpz"
          unzip -j "$cache/templates.tpz" templates/android_release.apk templates/android_debug.apk -d "$templates"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/android_sdk_path = \"$sdk\"" > "$cfg/editor_settings-4.7.tres"
          project="$cache/AoE2HDBeta-source/godot_game"
          godot="$cache/$engine"
          "$godot" --headless --path "$project" --import > "$cache/godot-android-import.log" 2>&1
          if grep -E 'SCRIPT ERROR|Failed to load script' "$cache/godot-android-import.log"; then exit 1; fi
          "$godot" --headless --path "$project" --export-release 'Android portable' "$cache/unsigned.apk"
          "$tools/zipalign" -P 16 -f 4 "$cache/unsigned.apk" "$cache/aligned.apk"
          keytool -genkeypair -keystore "$cache/test-signing.p12" -storetype PKCS12 \
            -storepass android -keypass android -alias aoe2mobile-test -keyalg RSA -keysize 2048 \
            -validity 3650 -dname 'CN=AoE2 HD Mobile test build' -noprompt
          apk="$PWD/android-artifact/AoE2HDMobile-1.0.6-VI-Android.apk"
          "$tools/apksigner" sign --ks "$cache/test-signing.p12" --ks-pass pass:android \
            --ks-key-alias aoe2mobile-test --out "$apk" "$cache/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee android-artifact/Signature.txt
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > android-artifact/AndroidInfo.txt
          grep -F "package: name='io.github.tranchautien1995.aoe2hdmobile' versionCode='106' versionName='1.0.6'" android-artifact/AndroidInfo.txt
          grep -E "^(sdkVersion|targetSdkVersion|native-code)" android-artifact/AndroidInfo.txt
          python3 - "$apk" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as apk:
              assert apk.testzip() is None
              files = apk.namelist()
              assert 'lib/arm64-v8a/libgodot_android.so' in files
              assert 'lib/armeabi-v7a/libgodot_android.so' in files
              assert any(x.startswith('assets/') and x.endswith(('project.binary', '.pck')) for x in files)
              assert not any(x.endswith(('.drs', '.slp', 'empires2_x1_p1.dat')) for x in files)
          PY
          rm -f "$apk.idsig"
          cp "$cache/AoE2HDBeta-source/LICENSE" android-artifact/COPYING.txt
          cp "$cache/AoE2HDBeta-source/NOTICE.md" VOICE-CREDITS.md android-artifact/
          (cd android-artifact && sha256sum *.apk > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AoE2HDMobile-1.0.6-VI-Android
          path: android-artifact/
          if-no-files-found: error
          retention-days: 30

  package:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-game-project
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          name: AoE2HDMobile-1.0.2-VI-iOS15.1-TrollStore
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44347646947
          path: baseline
      - name: Export the iOS resource pack
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          mkdir -p "$cache"
          tar -xzf prepared/game-project.tar.gz -C "$cache"
          engine=Godot_v4.7.2-stable_linux.x86_64
          curl -fLsS --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$engine.zip" -o "$cache/godot.zip"
          unzip -q "$cache/godot.zip" -d "$cache"
          project="$cache/AoE2HDBeta-source/godot_game"
          "$cache/$engine" --headless --path "$project" --import > "$cache/import.log" 2>&1
          if grep -E 'SCRIPT ERROR|Failed to load script' "$cache/import.log"; then exit 1; fi
          "$cache/$engine" --headless --path "$project" --export-pack 'iOS Portable' "$cache/game.pck"
          test -s "$cache/game.pck"
          "$cache/$engine" --headless --main-pack "$cache/game.pck" --quit-after 10 > "$cache/pack.log" 2>&1
          ! grep -E 'SCRIPT ERROR|Failed to load script' "$cache/pack.log"
      - name: Verify service reachability and package the IPA
        shell: bash
        run: |
          set -euo pipefail
          curl -fSs --max-time 8 -H 'Content-Type: application/json' --data '{"action":"status"}' https://domotix.co/aoeserver/lobby.php || true
          (cd baseline && sha256sum -c SHA256.txt)
          mkdir -p artifact
          python3 - <<'PY'
          import os
          import plistlib
          import zipfile
          from pathlib import Path

          cache = Path(os.environ['RUNNER_TEMP']) / 'aoe2'
          project = cache / 'AoE2HDBeta-source'
          baseline, = Path('baseline').glob('*.ipa')
          prefix = 'Payload/AoE2HDMobile.app/'
          target = Path('artifact/AoE2HDMobile-1.0.6-VI-iOS15.1-TrollStore.ipa')
          with zipfile.ZipFile(baseline) as source, zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as output:
              pack, = [name for name in source.namelist() if name.startswith(prefix) and name.endswith('.pck')]
              for item in source.infolist():
                  assert '/_CodeSignature/' not in item.filename
                  data = source.read(item)
                  if item.filename == pack:
                      data = (cache / 'game.pck').read_bytes()
                  elif item.filename == prefix + 'Info.plist':
                      info = plistlib.loads(data)
                      assert info['MinimumOSVersion'] == '15.1'
                      assert info['CFBundleIdentifier'] == 'io.github.tranchautien1995.aoe2hdmobile'
                      info['CFBundleShortVersionString'] = '1.0.6'
                      info['CFBundleVersion'] = '7'
                      data = plistlib.dumps(info, fmt=plistlib.FMT_BINARY)
                  elif item.filename in (prefix + 'COPYING.txt', prefix + 'NOTICE.md'):
                      data = (project / ('LICENSE' if item.filename.endswith('COPYING.txt') else 'NOTICE.md')).read_bytes()
                  output.writestr(item, data)
          PY
          cp baseline/BuildInfo.txt artifact/BuildInfo.txt
          printf '%s\n' 'Godot 4.7.2 iOS executable verified byte-for-byte from Xcode build 44347646947.' >> artifact/BuildInfo.txt
          (cd artifact && sha256sum *.ipa > SHA256.txt && zip -q ../package-verify.zip *)
          mkdir -p verified
          python3 verify_download.py package-verify.zip verified
      - uses: actions/upload-artifact@v4
        with:
          name: AoE2HDMobile-1.0.6-VI-iOS15.1-TrollStore
          path: artifact/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-game-project
          path: prepared

      - name: Set up Godot and export the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          mkdir -p "$cache/export"
          tar -xzf prepared/game-project.tar.gz -C "$cache"
          curl -fLsS --retry 3 "$base/Godot_v4.7.2-stable_macos.universal.zip" -o "$cache/godot.zip"
          ditto -x -k "$cache/godot.zip" "$cache/editor"
          curl -fLsS --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$cache/templates.tpz"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          unzip -j "$cache/templates.tpz" templates/ios.zip -d "$template_dir"
          godot="$cache/editor/Godot.app/Contents/MacOS/Godot"
          project="$cache/AoE2HDBeta-source/godot_game"
          "$godot" --headless --path "$project" --import >"$cache/godot-macos.log" 2>&1 || {
            tail -100 "$cache/godot-macos.log"
            exit 1
          }
          "$godot" --headless --path "$project" --export-release "iOS Portable" "$cache/export/AoE2HDMobile.ipa"
          test -d "$cache/export/AoE2HDMobile.xcodeproj"

      - name: Build and verify arm64 iPhone package
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project "$cache/export/AoE2HDMobile.xcodeproj" -scheme AoE2HDMobile \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$cache/derived" -quiet \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build
          app="$cache/derived/Build/Products/Release-iphoneos/AoE2HDMobile.app"
          plist="$app/Info.plist"
          plutil -lint "$plist"
          test "$(plutil -extract MinimumOSVersion raw "$plist")" = "15.1"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "1.0.6"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "io.github.tranchautien1995.aoe2hdmobile"
          test "$(plutil -extract UIFileSharingEnabled raw "$plist")" = "true"
          test "$(plutil -extract LSSupportsOpeningDocumentsInPlace raw "$plist")" = "true"
          executable="$app/$(plutil -extract CFBundleExecutable raw "$plist")"
          test "$(xcrun lipo -archs "$executable")" = "arm64"
          xcrun vtool -show-build "$executable" | tee "$cache/macho.txt"
          grep -Eq 'platform[[:space:]]+IOS$' "$cache/macho.txt"
          grep -Eq 'minos[[:space:]]+15\.1$' "$cache/macho.txt"
          find "$app" -type f -name '*.pck' -size +0c | grep -q .
          mkdir -p artifact "$cache/package/Payload"
          cp "$cache/macho.txt" artifact/BuildInfo.txt
          xcrun nm -m "$executable" >"$cache/symbols.txt"
          grep -E "(_CADynamicRange|_MTLTensorDomain)" "$cache/symbols.txt" | tee -a artifact/BuildInfo.txt || true
          cp "$cache/AoE2HDBeta-source/LICENSE" "$app/COPYING.txt"
          cp "$cache/AoE2HDBeta-source/NOTICE.md" "$app/NOTICE.md"
          cp VOICE-CREDITS.md "$app/VOICE-CREDITS.md"
          printf '%s\n' 'iOS build source and installation instructions:' 'https://github.com/tranchautien1995-hub/deche2' > "$app/Source.txt"
          ditto "$app" "$cache/package/Payload/AoE2HDMobile.app"
          ipa="$PWD/artifact/AoE2HDMobile-1.0.6-VI-iOS15.1-TrollStore.ipa"
          ditto -c -k --norsrc --keepParent "$cache/package/Payload" "$ipa"
          unzip -tq "$ipa"
          (cd artifact && shasum -a 256 *.ipa > SHA256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: AoE2HDMobile-1.0.6-VI-iOS15.1-TrollStore-Xcode
          path: artifact/
          if-no-files-found: error
          retention-days: 30
