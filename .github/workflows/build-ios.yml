name: Build iOS 15.1 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and verify skirmish, online lobby, voices and controls
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          mkdir -p "$cache"
          curl -fLsS --retry 3 https://domotix.co/download/9 -o "$cache/source.zip"
          printf '%s  %s\n' 2fff02c922ef5c6221dde6cd5b93569b427b277c38eae9e8231a7d70869573ef "$cache/source.zip" | sha256sum -c
          unzip -q "$cache/source.zip" -d "$cache"
          mv "$cache/AoE2HDBeta-1.2.0-source/AoE2HDBeta-source" "$cache/AoE2HDBeta-source"
          model=vi_VN-vais1000-medium
          base=https://huggingface.co/rhasspy/piper-voices/resolve/320d5f7f7751a17ef6512d5c23863056c6a11c0f/vi/vi_VN/vais1000/medium
          curl -fLsS --retry 3 "$base/$model.onnx?download=true" -o "$cache/$model.onnx"
          curl -fLsS --retry 3 "$base/$model.onnx.json?download=true" -o "$cache/$model.onnx.json"
          printf '%s  %s\n' 5e42428c4f6131f75557cf156c9c1526 "$cache/$model.onnx" 5ec9669253541d64ba97f60e422f1ad0 "$cache/$model.onnx.json" | md5sum -c
          python3 -m venv "$cache/voice-env"
          "$cache/voice-env/bin/pip" install 'piper-tts==1.4.1'
          project="$cache/AoE2HDBeta-source/godot_game"
          "$cache/voice-env/bin/python" unit_voice.py "$project" "$cache/$model.onnx"
          python3 prepare_ios.py "$project"
          engine=Godot_v4.7.2-stable_linux.x86_64
          curl -fLsS --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$engine.zip" -o "$cache/godot.zip"
          unzip -q "$cache/godot.zip" -d "$cache"
          godot="$cache/$engine"
          "$godot" --headless --path "$project" --import >"$cache/godot-import.log" 2>&1 || {
            tail -100 "$cache/godot-import.log"
            exit 1
          }
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' "$cache/godot-import.log"; then
            exit 1
          fi
          "$godot" --headless --path "$project" --quit-after 8 >"$cache/godot-first-run.log" 2>&1
          if grep -E 'SCRIPT ERROR|Failed to load script' "$cache/godot-first-run.log"; then
            exit 1
          fi
          "$godot" --headless --path "$project" --quit-after 150 res://tests/lasso.tscn | tee "$cache/godot-input.log"
          grep -F 'MOBILE INPUT AND VOICE: 0 failures' "$cache/godot-input.log"
          python3 "$cache/AoE2HDBeta-source/tools/mp_mock_server.py" 18081 > "$cache/mock-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if grep -q 'mock lobby server on' "$cache/mock-server.log"; then break; fi
            sleep 0.2
          done
          grep -q 'mock lobby server on' "$cache/mock-server.log"
          AOE_MP_URL=http://127.0.0.1:18081/ XDG_DATA_HOME="$cache/test-user-data" \
            timeout 35s "$godot" --headless --path "$project" res://tests/room_code_test.tscn 2>&1 | tee "$cache/godot-lobby.log"
          grep -F 'LOBBY AND ROOM CODE: 0 failures' "$cache/godot-lobby.log"
          ! grep -E 'SCRIPT ERROR|Failed to load script' "$cache/godot-lobby.log"
          tar -czf game-project.tar.gz --exclude='AoE2HDBeta-source/godot_game/.godot' -C "$cache" AoE2HDBeta-source
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-game-project
          path: game-project.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-game-project
          path: prepared

      - name: Set up Godot and export the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          mkdir -p "$cache/export"
          tar -xzf prepared/game-project.tar.gz -C "$cache"
          curl -fLsS --retry 3 "$base/Godot_v4.7.2-stable_macos.universal.zip" -o "$cache/godot.zip"
          ditto -x -k "$cache/godot.zip" "$cache/editor"
          curl -fLsS --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$cache/templates.tpz"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          unzip -j "$cache/templates.tpz" templates/ios.zip -d "$template_dir"
          godot="$cache/editor/Godot.app/Contents/MacOS/Godot"
          project="$cache/AoE2HDBeta-source/godot_game"
          "$godot" --headless --path "$project" --import >"$cache/godot-macos.log" 2>&1 || {
            tail -100 "$cache/godot-macos.log"
            exit 1
          }
          "$godot" --headless --path "$project" --export-release "iOS Portable" "$cache/export/AoE2HDMobile.ipa"
          test -d "$cache/export/AoE2HDMobile.xcodeproj"

      - name: Build and verify arm64 iPhone package
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/aoe2"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project "$cache/export/AoE2HDMobile.xcodeproj" -scheme AoE2HDMobile \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$cache/derived" -quiet \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build
          app="$cache/derived/Build/Products/Release-iphoneos/AoE2HDMobile.app"
          plist="$app/Info.plist"
          plutil -lint "$plist"
          test "$(plutil -extract MinimumOSVersion raw "$plist")" = "15.1"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "1.0.3"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "io.github.tranchautien1995.aoe2hdmobile"
          test "$(plutil -extract UIFileSharingEnabled raw "$plist")" = "true"
          test "$(plutil -extract LSSupportsOpeningDocumentsInPlace raw "$plist")" = "true"
          executable="$app/$(plutil -extract CFBundleExecutable raw "$plist")"
          test "$(xcrun lipo -archs "$executable")" = "arm64"
          xcrun vtool -show-build "$executable" | tee "$cache/macho.txt"
          grep -Eq 'platform[[:space:]]+IOS$' "$cache/macho.txt"
          grep -Eq 'minos[[:space:]]+15\.1$' "$cache/macho.txt"
          find "$app" -type f -name '*.pck' -size +0c | grep -q .
          mkdir -p artifact "$cache/package/Payload"
          cp "$cache/macho.txt" artifact/BuildInfo.txt
          xcrun nm -m "$executable" >"$cache/symbols.txt"
          grep -E "(_CADynamicRange|_MTLTensorDomain)" "$cache/symbols.txt" | tee -a artifact/BuildInfo.txt || true
          cp "$cache/AoE2HDBeta-source/LICENSE" "$app/COPYING.txt"
          cp "$cache/AoE2HDBeta-source/NOTICE.md" "$app/NOTICE.md"
          cp VOICE-CREDITS.md "$app/VOICE-CREDITS.md"
          printf '%s\n' 'iOS build source and installation instructions:' 'https://github.com/tranchautien1995-hub/deche2' > "$app/Source.txt"
          ditto "$app" "$cache/package/Payload/AoE2HDMobile.app"
          ipa="$PWD/artifact/AoE2HDMobile-1.0.3-VI-iOS15.1-TrollStore.ipa"
          ditto -c -k --norsrc --keepParent "$cache/package/Payload" "$ipa"
          unzip -tq "$ipa"
          (cd artifact && shasum -a 256 *.ipa > SHA256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: AoE2HDMobile-1.0.3-VI-iOS15.1-TrollStore
          path: artifact/
          if-no-files-found: error
          retention-days: 30
